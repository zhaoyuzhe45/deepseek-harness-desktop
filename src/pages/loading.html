<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在启动</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="startup-page">
  <div class="startup-drag-region" aria-hidden="true"></div>
  <div class="startup-window-controls">
    <button id="startup-minimize" aria-label="最小化" title="最小化" type="button"><span aria-hidden="true">−</span></button>
    <button id="startup-close" aria-label="关闭" title="关闭" type="button"><span aria-hidden="true">×</span></button>
  </div>
  <main class="startup-shell">
    <section class="startup-content">
      <img class="startup-logo" src="../../icon.png" alt="">
      <div class="startup-copy">
        <h1>正在启动 DSH</h1>
        <p>本地服务准备好后，应用会自动打开。</p>
      </div>
      <div class="spinner" role="status" aria-label="正在启动"></div>
    </section>
  </main>
  <script src="loading.js"></script>
</body>
</html>
